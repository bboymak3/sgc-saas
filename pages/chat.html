<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat — BotWA</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0a0a0a; color: #e8e8e8; height: 100vh; display: flex; flex-direction: column; }
    
    .header { background: linear-gradient(135deg, #16a34a 0%, #15803d 100%); padding: 14px 18px; display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
    .header .avatar { width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center; font-size: 1.2rem; }
    .header .info h3 { color: #fff; font-size: 0.95rem; font-weight: 700; }
    .header .info p { color: rgba(255,255,255,0.8); font-size: 0.75rem; }
    .header .status-dot { width: 8px; height: 8px; background: #4ade80; border-radius: 50%; display: inline-block; margin-right: 4px; }
    
    .chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; max-width: 700px; margin: 0 auto; width: 100%; }
    .message { max-width: 80%; padding: 10px 14px; border-radius: 12px; font-size: 0.95rem; line-height: 1.4; word-wrap: break-word; white-space: pre-wrap; }
    .message.bot { background: #1a1a1a; border: 1px solid #2a2a2a; align-self: flex-start; border-bottom-left-radius: 4px; }
    .message.user { background: #16a34a; color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
    .message.system { background: rgba(251,191,36,0.1); color: #fbbf24; border: 1px solid #fbbf24; align-self: center; font-size: 0.85rem; text-align: center; max-width: 90%; }
    .message.typing { color: #888; font-style: italic; }
    
    .suggestions { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 0; }
    .suggestion { background: #1a1a1a; border: 1px solid #22c55e; color: #22c55e; padding: 6px 12px; border-radius: 16px; font-size: 0.85rem; cursor: pointer; transition: all 0.2s; }
    .suggestion:hover { background: #22c55e; color: #fff; }
    
    .input-area { padding: 14px; background: #0a0a0a; border-top: 1px solid #2a2a2a; flex-shrink: 0; }
    .input-form { display: flex; gap: 8px; max-width: 700px; margin: 0 auto; align-items: center; }
    .input-form input[type="text"] { flex: 1; background: #1a1a1a; border: 1px solid #2a2a2a; color: #fff; padding: 12px; border-radius: 24px; font-size: 1rem; outline: none; }
    .input-form input[type="text"]:focus { border-color: #22c55e; }
    .input-form button { background: #16a34a; color: #fff; border: none; width: 44px; height: 44px; border-radius: 50%; cursor: pointer; font-size: 1.2rem; transition: background 0.2s; display: flex; align-items: center; justify-content: center; }
    .input-form button:hover { background: #15803d; }
    .input-form button:disabled { opacity: 0.5; cursor: not-allowed; }
    .input-form .icon-btn { background: #1a1a1a; border: 1px solid #2a2a2a; color: #e8e8e8; width: 44px; height: 44px; border-radius: 50%; cursor: pointer; font-size: 1.1rem; transition: all 0.2s; display: flex; align-items: center; justify-content: center; flex-shrink: 0; position: relative; overflow: hidden; }
    .input-form .icon-btn:hover { border-color: #22c55e; color: #22c55e; }
    .input-form .icon-btn.recording { background: #ef4444; border-color: #ef4444; color: #fff; animation: pulse 1.2s infinite; }
    @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.1); } }
    .input-form .icon-btn.tts-on { background: #22c55e; border-color: #22c55e; color: #0a0a0a; }
    .image-preview { max-width: 700px; margin: 0 auto 8px; padding: 6px; background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 12px; display: none; align-items: center; gap: 10px; }
    .image-preview.show { display: flex; }
    .image-preview img { width: 50px; height: 50px; object-fit: cover; border-radius: 8px; }
    .image-preview .info { flex: 1; font-size: 0.85rem; color: #999; }
    .image-preview .remove { background: transparent; border: none; color: #ef4444; cursor: pointer; font-size: 1.2rem; padding: 4px 8px; }
    .listening-indicator { text-align: center; padding: 6px; color: #ef4444; font-size: 0.85rem; display: none; font-weight: 500; }
    .listening-indicator.show { display: block; animation: pulse 1.2s infinite; }
    .message.image-msg { padding: 4px; }
    .message.image-msg img { max-width: 100%; border-radius: 8px; display: block; }
    .unsupported-hint { font-size: 0.72rem; color: #666; text-align: center; padding: 4px; }
    
    .services-toggle { text-align: center; padding: 8px; color: #888; font-size: 0.85rem; cursor: pointer; }
    .services-toggle:hover { color: #22c55e; }
    .services-list { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 8px; padding: 12px; margin: 8px 0; }
    .services-list h4 { color: #22c55e; margin-bottom: 8px; }
    .services-list .service { padding: 6px 0; border-bottom: 1px solid #2a2a2a; font-size: 0.9rem; }
    .services-list .service:last-child { border-bottom: none; }
    
    .loading-overlay { position: fixed; inset: 0; background: #0a0a0a; display: flex; align-items: center; justify-content: center; z-index: 100; }
    .loading-overlay .spinner { width: 40px; height: 40px; border: 3px solid #2a2a2a; border-top-color: #22c55e; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="loading-overlay" id="loadingOverlay">
    <div class="spinner"></div>
  </div>
  
  <div class="header">
    <div class="avatar">🤖</div>
    <div class="info">
      <h3 id="businessName">Cargando...</h3>
      <p><span class="status-dot"></span>En línea</p>
    </div>
  </div>
  
  <div class="chat-container" id="chatContainer">
    <div class="message system" id="welcomeMsg">Conectando con el asistente...</div>
  </div>
  
  <div class="input-area">
    <div class="services-toggle" id="servicesToggle">📋 Ver servicios</div>
    <div class="services-list" id="servicesList" style="display:none;"></div>
    <div class="listening-indicator" id="listeningIndicator">🎤 Escuchando...</div>
    <div class="image-preview" id="imagePreview">
      <img id="imagePreviewImg" alt="preview">
      <div class="info" id="imagePreviewInfo">Imagen lista para enviar</div>
      <button type="button" class="remove" onclick="clearImage()">✕</button>
    </div>
    <form class="input-form" id="chatForm">
      <input type="file" id="imageInput" accept="image/*" style="display:none;">
      <button type="button" class="icon-btn" id="imageBtn" title="Adjuntar imagen" disabled>📎</button>
      <button type="button" class="icon-btn" id="micBtn" title="Dictar por voz" disabled>🎤</button>
      <button type="button" class="icon-btn" id="ttsBtn" title="Leer respuestas en voz alta">🔊</button>
      <input type="text" id="messageInput" placeholder="Escribe tu mensaje..." autocomplete="off" disabled>
      <button type="submit" id="sendBtn" disabled>➤</button>
    </form>
    <div class="unsupported-hint" id="unsupportedHint" style="display:none;">Nota: voz y TTS solo funcionan en Chrome/Edge.</div>
  </div>
  
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const slug = urlParams.get('t') || 'sgc';
    const API_BASE = 'https://sgc-saas.activo.workers.dev';
    let messages = [];
    let isTyping = false;
    let attachedImage = null; // base64 data URL string when image is attached
    let ttsEnabled = false;
    let recognition = null;
    let isRecording = false;

    // ===== MEJORA 17 (web): Image attachment =====
    const imageInput = document.getElementById('imageInput');
    const imageBtn = document.getElementById('imageBtn');
    const imagePreview = document.getElementById('imagePreview');
    const imagePreviewImg = document.getElementById('imagePreviewImg');
    const imagePreviewInfo = document.getElementById('imagePreviewInfo');

    imageBtn.addEventListener('click', () => imageInput.click());
    imageInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      if (file.size > 4 * 1024 * 1024) {
        alert('La imagen es demasiado grande (máx 4MB).');
        imageInput.value = '';
        return;
      }
      const reader = new FileReader();
      reader.onload = () => {
        attachedImage = reader.result;
        imagePreviewImg.src = attachedImage;
        const kb = Math.round(file.size / 1024);
        imagePreviewInfo.textContent = `${file.name} (${kb} KB)`;
        imagePreview.classList.add('show');
      };
      reader.readAsDataURL(file);
    });
    window.clearImage = function() {
      attachedImage = null;
      imageInput.value = '';
      imagePreview.classList.remove('show');
    };

    // ===== MEJORA 18 (web): Mic button (SpeechRecognition) =====
    const micBtn = document.getElementById('micBtn');
    const ttsBtn = document.getElementById('ttsBtn');
    const listeningIndicator = document.getElementById('listeningIndicator');
    const unsupportedHint = document.getElementById('unsupportedHint');
    const SpeechRecognitionAPI = window.SpeechRecognition || window.webkitSpeechRecognition;
    const hasTTS = 'speechSynthesis' in window;
    if (!SpeechRecognitionAPI || !hasTTS) {
      unsupportedHint.style.display = 'block';
      unsupportedHint.textContent = 'Nota: voz/TTS solo funcionan en Chrome/Edge. ' + (!SpeechRecognitionAPI ? 'Micrófono no soportado. ' : '') + (!hasTTS ? 'TTS no soportado.' : '');
    }
    if (SpeechRecognitionAPI) {
      recognition = new SpeechRecognitionAPI();
      recognition.lang = 'es-ES';
      recognition.interimResults = false;
      recognition.maxAlternatives = 1;
      recognition.continuous = false;
      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        document.getElementById('messageInput').value = transcript;
        document.getElementById('messageInput').focus();
      };
      recognition.onerror = (event) => {
        console.warn('SpeechRecognition error:', event.error);
        showToast('Error de micrófono: ' + event.error);
      };
      recognition.onend = () => {
        isRecording = false;
        micBtn.classList.remove('recording');
        listeningIndicator.classList.remove('show');
      };
      micBtn.addEventListener('click', () => {
        if (!SpeechRecognitionAPI) return;
        if (isRecording) {
          recognition.stop();
        } else {
          try {
            recognition.start();
            isRecording = true;
            micBtn.classList.add('recording');
            listeningIndicator.classList.add('show');
          } catch (e) {
            console.warn('mic start failed', e);
          }
        }
      });
    }

    // ===== TTS toggle =====
    ttsBtn.addEventListener('click', () => {
      if (!hasTTS) return;
      ttsEnabled = !ttsEnabled;
      if (ttsEnabled) {
        ttsBtn.classList.add('tts-on');
        showToast('🔊 TTS activado');
      } else {
        ttsBtn.classList.remove('tts-on');
        speechSynthesis.cancel();
        showToast('🔇 TTS desactivado');
      }
    });

    function speak(text) {
      if (!ttsEnabled || !hasTTS) return;
      try {
        speechSynthesis.cancel();
        const clean = text.replace(/[\*_#>`]/g, '').slice(0, 500);
        const u = new SpeechSynthesisUtterance(clean);
        u.lang = 'es-ES';
        u.rate = 1.0;
        speechSynthesis.speak(u);
      } catch (e) {}
    }

    function showToast(msg) {
      let t = document.getElementById('toastMsg');
      if (!t) {
        t = document.createElement('div');
        t.id = 'toastMsg';
        t.style.cssText = 'position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#1a1a1a;border:1px solid #2a2a2a;color:#e8e8e8;padding:10px 18px;border-radius:999px;font-size:0.85rem;z-index:200;box-shadow:0 4px 20px rgba(0,0,0,0.5);transition:opacity 0.2s;opacity:0;pointer-events:none;';
        document.body.appendChild(t);
      }
      t.textContent = msg;
      t.style.opacity = '1';
      clearTimeout(t._timer);
      t._timer = setTimeout(() => { t.style.opacity = '0'; }, 2500);
    }
    
    async function init() {
      try {
        const res = await fetch(`${API_BASE}/api/tenant/public?t=${slug}`);
        const data = await res.json();
        
        if (!data.success) {
          document.getElementById('welcomeMsg').textContent = '❌ ' + (data.error || 'No se pudo cargar');
          document.getElementById('loadingOverlay').style.display = 'none';
          return;
        }
        
        document.title = `${data.tenant.business_name} — Chat`;
        document.getElementById('businessName').textContent = data.tenant.business_name;
        document.getElementById('welcomeMsg').textContent = `¡Hola! 👋 Soy el asistente virtual de ${data.tenant.business_name}. ¿En qué puedo ayudarte hoy?`;
        
        // Render services list
        if (data.servicios && data.servicios.length > 0) {
          const list = document.getElementById('servicesList');
          list.innerHTML = '<h4>📋 Servicios disponibles</h4>' + data.servicios.map(s => 
            `<div class="service"><strong>${s.nombre}</strong> — $${s.precio.toLocaleString('es-CL')} (${s.categoria}, ~${s.duracion_minutos} min)</div>`
          ).join('');
        }
        
        // Enable input
        document.getElementById('messageInput').disabled = false;
        document.getElementById('sendBtn').disabled = false;
        document.getElementById('imageBtn').disabled = false;
        if (SpeechRecognitionAPI) document.getElementById('micBtn').disabled = false;
        document.getElementById('messageInput').focus();
        
        // Show suggestions
        const suggestions = document.createElement('div');
        suggestions.className = 'suggestions';
        suggestions.innerHTML = `
          <div class="suggestion" onclick="sendQuick('Hola, quiero agendar una cita')">📅 Agendar cita</div>
          <div class="suggestion" onclick="sendQuick('¿Qué servicios tienen?')">🔧 Ver servicios</div>
          <div class="suggestion" onclick="sendQuick('¿Cuál es el horario?')">🕐 Horario</div>
          <div class="suggestion" onclick="sendQuick('¿Cuáles son sus precios?')">💰 Precios</div>
        `;
        document.getElementById('chatContainer').appendChild(suggestions);
      } catch (e) {
        document.getElementById('welcomeMsg').textContent = '❌ Error de conexión';
      } finally {
        document.getElementById('loadingOverlay').style.display = 'none';
      }
    }
    
    function addMessage(role, content) {
      const div = document.createElement('div');
      div.className = `message ${role}`;
      div.textContent = content;
      document.getElementById('chatContainer').appendChild(div);
      document.getElementById('chatContainer').scrollTop = document.getElementById('chatContainer').scrollHeight;
    }
    
    async function sendMessage(text) {
      if ((!text && !attachedImage) || isTyping) return;
      isTyping = true;
      const sendImage = attachedImage;
      const finalText = text || (sendImage ? '(imagen adjunta)' : '');
      if (finalText) addMessage('user', finalText);
      if (sendImage) {
        // Show image in chat as user message
        const imgDiv = document.createElement('div');
        imgDiv.className = 'message user image-msg';
        imgDiv.innerHTML = `<img src="${sendImage}" alt="imagen adjunta">`;
        document.getElementById('chatContainer').appendChild(imgDiv);
      }
      messages.push({ role: 'user', content: finalText });
      
      // Typing indicator
      const typingDiv = document.createElement('div');
      typingDiv.className = 'message bot typing';
      typingDiv.id = 'typingIndicator';
      typingDiv.textContent = '... escribiendo';
      document.getElementById('chatContainer').appendChild(typingDiv);
      document.getElementById('chatContainer').scrollTop = document.getElementById('chatContainer').scrollHeight;
      
      document.getElementById('messageInput').value = '';
      document.getElementById('sendBtn').disabled = true;
      clearImage();
      
      try {
        const reqBody = { messages };
        if (sendImage) reqBody.image = sendImage;
        const res = await fetch(`${API_BASE}/api/chat?t=${slug}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(reqBody)
        });
        
        document.getElementById('typingIndicator')?.remove();
        
        if (!res.ok) {
          addMessage('bot', 'Lo siento, hubo un error. Intenta de nuevo.');
          isTyping = false;
          document.getElementById('sendBtn').disabled = false;
          return;
        }
        
        // Streaming response
        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let botText = '';
        const botDiv = document.createElement('div');
        botDiv.className = 'message bot';
        botDiv.textContent = '';
        document.getElementById('chatContainer').appendChild(botDiv);
        
        let buffer = '';
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          
          // Parse SSE
          const lines = buffer.split('\n');
          buffer = lines.pop() || '';
          for (const line of lines) {
            if (line.startsWith('data: ')) {
              try {
                const data = JSON.parse(line.slice(6));
                if (data.response) {
                  botText += data.response;
                  botDiv.textContent = botText;
                  document.getElementById('chatContainer').scrollTop = document.getElementById('chatContainer').scrollHeight;
                }
              } catch (e) {}
            }
          }
        }
        
        if (!botText) {
          // Si no fue SSE, leer como texto plano
          botText = await res.text();
          botDiv.textContent = botText;
        }
        
        messages.push({ role: 'assistant', content: botText });
        speak(botText);
      } catch (e) {
        document.getElementById('typingIndicator')?.remove();
        addMessage('bot', 'Error de conexión. Intenta de nuevo.');
      } finally {
        isTyping = false;
        document.getElementById('sendBtn').disabled = false;
        document.getElementById('messageInput').focus();
      }
    }
    
    window.sendQuick = function(text) {
      sendMessage(text);
    };
    
    document.getElementById('chatForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const input = document.getElementById('messageInput');
      const text = input.value.trim();
      if (text) sendMessage(text);
    });
    
    document.getElementById('servicesToggle').addEventListener('click', () => {
      const list = document.getElementById('servicesList');
      list.style.display = list.style.display === 'none' ? 'block' : 'none';
      document.getElementById('servicesToggle').textContent = list.style.display === 'none' ? '📋 Ver servicios' : '📋 Ocultar servicios';
    });
    
    init();
  </script>
</body>
</html>
