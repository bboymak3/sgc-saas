<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estado de mi solicitud — BotWA</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2322c55e'/%3E%3Cpath d='M32 12c-11 0-20 8.5-20 19 0 3.6 1 7 3 10L12 52l11.5-3c2.8 1.5 6 2.3 9.3 2.3 11 0 20-8.5 20-19S43 12 32 12z' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #0a0a0a;
      --bg-1: #111111;
      --bg-2: #1a1a1a;
      --border: #2a2a2a;
      --text: #e8e8e8;
      --text-muted: #999;
      --text-dim: #666;
      --primary: #22c55e;
      --primary-dark: #16a34a;
      --primary-darker: #15803d;
      --danger: #ef4444;
      --warn: #fbbf24;
      --radius: 14px;
      --radius-sm: 10px;
      --shadow: 0 10px 40px rgba(0,0,0,0.4);
    }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      background-image: radial-gradient(circle at 70% -10%, rgba(34,197,94,0.08), transparent 50%);
      color: var(--text);
      min-height: 100vh;
      padding: 40px 20px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    .container { max-width: 640px; margin: 0 auto; }
    a { color: var(--primary); }
    .top-logo {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      margin-bottom: 24px; text-decoration: none;
    }
    .top-logo:hover { text-decoration: none; }
    .logo-mark {
      width: 38px; height: 38px; border-radius: 10px;
      background: linear-gradient(135deg, var(--primary), var(--primary-darker));
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 6px 20px rgba(34,197,94,0.35);
    }
    .logo-mark svg { width: 24px; height: 24px; }
    .top-logo .name { font-weight: 800; font-size: 1.3rem; color: #fff; letter-spacing: -0.5px; }
    .top-logo .name .accent { color: var(--primary); }

    .card {
      background: linear-gradient(180deg, var(--bg-2), var(--bg-1));
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 36px;
      margin-bottom: 20px;
      box-shadow: var(--shadow);
      animation: cardIn 0.4s;
    }
    @keyframes cardIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

    .status-banner {
      display: flex; align-items: center; gap: 14px;
      padding: 16px 20px;
      border-radius: var(--radius);
      margin-bottom: 24px;
      border: 1px solid;
    }
    .status-banner .icon { font-size: 1.8rem; flex-shrink: 0; }
    .status-banner .body .title { font-weight: 700; font-size: 1.05rem; }
    .status-banner .body .sub { font-size: 0.88rem; opacity: 0.85; margin-top: 2px; }
    .status-pending { background: rgba(251,191,36,0.08); color: var(--warn); border-color: rgba(251,191,36,0.3); }
    .status-approved { background: rgba(34,197,94,0.08); color: var(--primary); border-color: rgba(34,197,94,0.3); }
    .status-active { background: rgba(34,197,94,0.08); color: var(--primary); border-color: rgba(34,197,94,0.3); }
    .status-rejected { background: rgba(239,68,68,0.08); color: var(--danger); border-color: rgba(239,68,68,0.3); }
    .status-suspended { background: rgba(239,68,68,0.08); color: var(--danger); border-color: rgba(239,68,68,0.3); }

    h1 {
      color: #fff; font-size: 1.7rem; font-weight: 800;
      letter-spacing: -0.5px; margin-bottom: 4px;
    }
    .slug-line {
      color: var(--text-muted); font-size: 0.88rem;
      margin-bottom: 22px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    .info-list {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      margin-bottom: 22px;
    }
    .info-row {
      display: flex; justify-content: space-between;
      padding: 12px 18px;
      border-bottom: 1px solid var(--border);
      gap: 12px;
    }
    .info-row:last-child { border-bottom: 0; }
    .info-row .label { color: var(--text-muted); font-size: 0.9rem; }
    .info-row .value { color: #fff; font-weight: 600; text-align: right; word-break: break-word; font-size: 0.92rem; }

    .qr-section { text-align: center; padding: 8px 0; }
    .qr-section h3 {
      color: #fff; font-size: 1.15rem; margin-bottom: 8px;
      font-weight: 700;
    }
    .qr-section .lead { color: var(--text-muted); margin-bottom: 22px; font-size: 0.95rem; }

    .qr-frame {
      display: inline-block; padding: 18px;
      background: #fff; border-radius: 18px;
      margin: 0 auto 22px;
      box-shadow: 0 12px 40px rgba(34,197,94,0.18);
      position: relative;
      min-width: 260px; min-height: 260px;
    }
    .qr-frame img {
      display: block; width: 240px; height: 240px;
      object-fit: contain;
    }
    .qr-fallback {
      width: 240px; height: 240px;
      display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 8px;
      color: #444;
      font-size: 0.85rem;
      text-align: center;
      padding: 20px;
    }
    .qr-fallback .icon { font-size: 3rem; }
    .qr-corner {
      position: absolute; width: 24px; height: 24px;
      border: 3px solid var(--primary);
    }
    .qr-corner.tl { top: 6px; left: 6px; border-right: 0; border-bottom: 0; border-radius: 6px 0 0 0; }
    .qr-corner.tr { top: 6px; right: 6px; border-left: 0; border-bottom: 0; border-radius: 0 6px 0 0; }
    .qr-corner.bl { bottom: 6px; left: 6px; border-right: 0; border-top: 0; border-radius: 0 0 0 6px; }
    .qr-corner.br { bottom: 6px; right: 6px; border-left: 0; border-top: 0; border-radius: 0 0 6px 0; }

    .instructions {
      background: var(--bg); border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 22px 22px 22px 22px;
      margin: 22px 0;
      text-align: left;
    }
    .instructions h4 {
      color: #fff; font-size: 0.95rem; margin-bottom: 14px;
      font-weight: 700;
    }
    .instructions ol {
      list-style: none; counter-reset: step;
      padding: 0;
    }
    .instructions ol li {
      counter-increment: step;
      display: flex; gap: 12px; padding: 8px 0;
      color: var(--text); font-size: 0.92rem;
      align-items: flex-start;
    }
    .instructions ol li::before {
      content: counter(step);
      flex-shrink: 0;
      width: 24px; height: 24px; line-height: 24px;
      background: rgba(34,197,94,0.12); color: var(--primary);
      border-radius: 50%;
      text-align: center; font-size: 0.78rem; font-weight: 700;
      margin-top: 1px;
    }

    .note-card {
      background: rgba(34,197,94,0.05); border: 1px solid rgba(34,197,94,0.25);
      border-radius: var(--radius);
      padding: 14px 18px;
      margin: 16px 0;
      color: var(--primary); font-size: 0.9rem;
      display: flex; gap: 10px; align-items: flex-start;
    }
    .note-card .icon { flex-shrink: 0; font-size: 1.1rem; }

    .actions-row {
      display: flex; gap: 12px; flex-wrap: wrap; margin-top: 22px;
    }
    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 12px 22px;
      border-radius: 999px;
      font-weight: 700; font-size: 0.95rem;
      cursor: pointer; border: 0;
      font-family: inherit;
      transition: all 0.2s; text-decoration: none;
    }
    .btn-primary { background: var(--primary); color: #042713; }
    .btn-primary:hover { background: #fff; text-decoration: none; }
    .btn-secondary { background: var(--bg-2); color: #fff; border: 1px solid var(--border); }
    .btn-secondary:hover { border-color: var(--primary); text-decoration: none; }

    .copy-pill {
      display: inline-flex; align-items: center; gap: 8px;
      background: var(--bg-2); border: 1px solid var(--border);
      padding: 8px 14px; border-radius: 999px;
      font-size: 0.85rem; color: var(--text-muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .copy-pill code { color: var(--primary); }

    .loading-wrap { text-align: center; padding: 80px 20px; }
    .spinner {
      width: 44px; height: 44px;
      border: 3px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-wrap p { color: var(--text-muted); }

    .auto-refresh-tag {
      text-align: center; color: var(--text-dim); font-size: 0.78rem;
      margin-top: 14px;
      display: inline-flex; align-items: center; gap: 6px;
    }
    .auto-refresh-tag .dot {
      width: 6px; height: 6px; background: var(--primary); border-radius: 50%;
      animation: pulse 2s infinite;
    }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: var(--bg-2); border: 1px solid var(--border);
      border-left: 4px solid var(--primary);
      border-radius: var(--radius-sm);
      padding: 12px 18px;
      box-shadow: var(--shadow);
      color: #fff; font-size: 0.9rem; font-weight: 600;
      z-index: 100;
      animation: toastIn 0.25s;
    }
    @keyframes toastIn { from { opacity: 0; transform: translate(-50%, 10px); } to { opacity: 1; transform: translateX(-50%); } }

    @media (max-width: 640px) {
      body { padding: 24px 16px; }
      .card { padding: 24px; }
      h1 { font-size: 1.4rem; }
      .qr-frame { min-width: 220px; min-height: 220px; padding: 14px; }
      .qr-frame img, .qr-fallback { width: 200px; height: 200px; }
    }
  </style>
</head>
<body>
  <a href="index.html" class="top-logo">
    <span class="logo-mark">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2C6.5 2 2 6.1 2 11.2c0 1.9.6 3.7 1.7 5.3L2 22l5.7-1.5c1.4.8 3 1.2 4.6 1.2 5.5 0 10-4.1 10-9.2S17.5 2 12 2z" fill="#fff"/>
      </svg>
    </span>
    <span class="name">Bot<span class="accent">WA</span></span>
  </a>

  <div class="container">
    <div id="content">
      <div class="loading-wrap">
        <div class="spinner"></div>
        <p>Cargando estado…</p>
      </div>
    </div>
  </div>

  <script>
    const WORKER_URL = 'https://sgc-saas.activo.workers.dev';
    const urlParams = new URLSearchParams(window.location.search);
    const slug = urlParams.get('slug');
    // Clave privada del negocio (llega en el enlace de WhatsApp como #k=...)
    const KEY_STORAGE = 'sgc_panel_key_' + slug;
    function storageGet(k) { try { return localStorage.getItem(k); } catch (_) { return null; } }
    function storageSet(k, v) { try { localStorage.setItem(k, v); } catch (_) {} }
    const PANEL_KEY = (function () {
      const m = window.location.hash.match(/[#&]k=([0-9a-fA-F]{16,128})/);
      if (m) {
        storageSet(KEY_STORAGE, m[1]);
        history.replaceState(null, '', window.location.pathname + window.location.search);
        return m[1];
      }
      return storageGet(KEY_STORAGE);
    })();
    let lastQr = null;
    let lastQrAt = 0;

    if (!slug) {
      document.getElementById('content').innerHTML = `
        <div class="card">
          <h1>Slug requerido</h1>
          <p style="color:var(--text-muted);margin-top:8px;">Necesitas un slug para ver el estado de tu solicitud. Revisa el link que te dimos al registrarte.</p>
          <div class="actions-row">
            <a href="index.html" class="btn btn-primary">← Volver al inicio</a>
          </div>
        </div>
      `;
    } else {
      checkStatus();
      setInterval(checkStatus, 15000);
    }

    function escapeHtml(s) {
      if (s == null) return '';
      return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }
    function fmtDate(s) {
      if (!s) return '—';
      const d = new Date(s + (s.length === 10 ? 'T00:00:00' : 'Z'));
      if (isNaN(d.getTime())) return escapeHtml(s);
      return d.toLocaleString('es-CL', { dateStyle: 'medium', timeStyle: 'short' });
    }

    async function checkStatus() {
      try {
        const res = await fetch(`${WORKER_URL}/api/onboarding/status?slug=${encodeURIComponent(slug)}`);
        const data = await res.json();

        if (!data.success) {
          document.getElementById('content').innerHTML = `
            <div class="card">
              <h1>⚠️ Error</h1>
              <p style="color:var(--text-muted);margin-top:8px;">${escapeHtml(data.error || 'No se pudo obtener el estado')}</p>
              <div class="actions-row">
                <a href="index.html" class="btn btn-primary">← Volver al inicio</a>
              </div>
            </div>
          `;
          return;
        }

        const t = data.tenant;
        let bannerClass = 'status-pending';
        let bannerIcon = '⏳';
        let bannerTitle = 'Pendiente de aprobación';
        let bannerSub = 'Estamos validando tu solicitud…';
        let extraHtml = '';
        let actionsHtml = `<a href="index.html" class="btn btn-secondary">← Volver al inicio</a>`;

        if (t.status === 'pending_approval') {
          bannerClass = 'status-pending';
          bannerIcon = '⏳';
          bannerTitle = 'Pendiente de aprobación';
          bannerSub = 'Estamos validando tu solicitud. Te avisaremos por WhatsApp en cuanto sea aprobada.';
          extraHtml = `
            <div class="note-card">
              <span class="icon">📲</span>
              <span>Te contactaremos al WhatsApp <strong>${escapeHtml(t.whatsapp_number || '')}</strong> en cuanto sea aprobada (generalmente en minutos).</span>
            </div>
            <p class="auto-refresh-tag"><span class="dot"></span> Esta página se actualiza automáticamente cada 15 segundos</p>
          `;
        } else if (t.status === 'approved') {
          bannerClass = 'status-approved';
          bannerIcon = '✅';
          bannerTitle = '¡Aprobado! Conecta tu WhatsApp';
          bannerSub = 'Escanea el código QR para activar el bot en tu número.';
          if (data.qr_available && PANEL_KEY) {
            extraHtml = renderQRSection(t);
            actionsHtml = `
              <button type="button" class="btn btn-primary" onclick="loadQr(true)">🔄 Generar QR nuevo</button>
              <a href="index.html" class="btn btn-secondary">← Volver al inicio</a>
            `;
          } else if (data.qr_available) {
            extraHtml = `
              <div class="note-card">
                <span class="icon">🔐</span>
                <span>Por seguridad, el QR solo se muestra desde el enlace privado que te enviamos por WhatsApp. Ábrelo desde ese mensaje o pide uno nuevo.</span>
              </div>
            `;
            actionsHtml = `
              <button type="button" class="btn btn-primary" onclick="sendLink(this)">📲 Enviarme el enlace por WhatsApp</button>
              <a href="index.html" class="btn btn-secondary">← Volver al inicio</a>
            `;
          } else {
            extraHtml = `
              <div class="note-card">
                <span class="icon">⏳</span>
                <span>Estamos generando tu código QR. Te llegará por WhatsApp en segundos. Si no te llega en 2 minutos, escríbenos al +58 416-7775771.</span>
              </div>
            `;
          }
        } else if (t.status === 'active') {
          bannerClass = 'status-active';
          bannerIcon = '🎉';
          bannerTitle = '¡Bot activo y funcionando!';
          bannerSub = 'Tu asistente de WhatsApp ya está atendiendo clientes.';
          const adminUrl = `${location.origin}/admin?t=${encodeURIComponent(t.slug)}`;
          const adminHref = `/admin?t=${encodeURIComponent(t.slug)}${PANEL_KEY ? '#k=' + PANEL_KEY : ''}`;
          extraHtml = `
            <div class="note-card">
              <span class="icon">🚀</span>
              <span>Tu bot está funcionando. Prueba escribiéndote desde otro WhatsApp para verlo en acción.</span>
            </div>
            <h3 style="color:#fff;font-size:1.1rem;margin:20px 0 10px;font-weight:700;">Panel de administración</h3>
            <p style="color:var(--text-muted);margin-bottom:14px;font-size:0.92rem;">Gestiona tus citas, servicios y configuración desde tu panel exclusivo:</p>
            <div class="copy-pill" style="margin-bottom:12px;">
              <span>🔗</span>
              <code id="adminLink">${escapeHtml(adminUrl)}</code>
              <button id="copyBtn" style="background:none;border:0;color:var(--primary);cursor:pointer;font-weight:700;font-family:inherit;font-size:0.85rem;">Copiar</button>
            </div>
          `;
          actionsHtml = `
            <a href="${adminHref}" class="btn btn-primary">🚀 Abrir mi panel admin</a>
            <a href="index.html" class="btn btn-secondary">← Volver al inicio</a>
          `;
        } else if (t.status === 'rejected') {
          bannerClass = 'status-rejected';
          bannerIcon = '❌';
          bannerTitle = 'Solicitud rechazada';
          bannerSub = 'Tu solicitud no pudo ser aprobada en este momento.';
          extraHtml = `
            <div class="note-card" style="background:rgba(239,68,68,0.05);border-color:rgba(239,68,68,0.25);color:var(--danger);">
              <span class="icon">💬</span>
              <span>Si crees que fue un error, escríbenos al WhatsApp <a href="https://wa.me/584167775771" target="_blank" rel="noopener" style="color:var(--danger);font-weight:700;">+58 416-7775771</a> para revisarlo.</span>
            </div>
          `;
        } else if (t.status === 'suspended') {
          bannerClass = 'status-suspended';
          bannerIcon = '⏸️';
          bannerTitle = 'Cuenta suspendida';
          bannerSub = 'Tu cuenta está temporalmente suspendida.';
          extraHtml = `
            <div class="note-card" style="background:rgba(239,68,68,0.05);border-color:rgba(239,68,68,0.25);color:var(--danger);">
              <span class="icon">💬</span>
              <span>Para reactivar tu cuenta, contacta al WhatsApp <a href="https://wa.me/584167775771" target="_blank" rel="noopener" style="color:var(--danger);font-weight:700;">+58 416-7775771</a>.</span>
            </div>
          `;
        }

        document.getElementById('content').innerHTML = `
          <div class="card">
            <h1>${bannerIcon} ${escapeHtml(t.business_name || 'Mi negocio')}</h1>
            <p class="slug-line">slug: ${escapeHtml(t.slug)}</p>

            <div class="status-banner ${bannerClass}">
              <span class="icon">${bannerIcon}</span>
              <div class="body">
                <div class="title">${bannerTitle}</div>
                <div class="sub">${bannerSub}</div>
              </div>
            </div>

            <div class="info-list">
              <div class="info-row"><span class="label">Rubro</span><span class="value">${escapeHtml(t.rubro || '—')}</span></div>
              <div class="info-row"><span class="label">WhatsApp</span><span class="value">${escapeHtml(t.whatsapp_number || '—')}</span></div>
              <div class="info-row"><span class="label">Creado</span><span class="value">${fmtDate(t.created_at)}</span></div>
              ${t.approved_at ? `<div class="info-row"><span class="label">Aprobado</span><span class="value">${fmtDate(t.approved_at)}</span></div>` : ''}
              ${t.active_at ? `<div class="info-row"><span class="label">Activo desde</span><span class="value">${fmtDate(t.active_at)}</span></div>` : ''}
            </div>

            ${extraHtml}

            <div class="actions-row">
              ${actionsHtml}
            </div>
          </div>
        `;

        if (document.getElementById('qrImg')) loadQr(false);

        // Bind copy button if present
        const copyBtn = document.getElementById('copyBtn');
        if (copyBtn) {
          copyBtn.addEventListener('click', () => {
            const link = document.getElementById('adminLink').textContent;
            navigator.clipboard.writeText(link).then(() => showToast('✓ Link copiado al portapapeles')).catch(() => showToast('No se pudo copiar. Cópialo manualmente.'));
          });
        }
      } catch (error) {
        console.error('Error:', error);
        document.getElementById('content').innerHTML = `
          <div class="card">
            <h1>⚠️ Error de conexión</h1>
            <p style="color:var(--text-muted);margin-top:8px;">No se pudo conectar con el servidor. ${escapeHtml(error.message || '')}</p>
            <div class="actions-row">
              <button onclick="location.reload()" class="btn btn-primary">Reintentar</button>
              <a href="index.html" class="btn btn-secondary">← Volver al inicio</a>
            </div>
          </div>
        `;
      }
    }

    async function loadQr(force) {
      const img = document.getElementById('qrImg');
      if (!img) return;
      const show = (b64) => {
        img.src = 'data:image/png;base64,' + b64;
        img.style.display = 'block';
        const f = document.getElementById('qrFallback');
        if (f) f.style.display = 'none';
      };
      // El QR de WhatsApp expira: se renueva cada 30 s
      if (!force && lastQr && Date.now() - lastQrAt < 30000) return show(lastQr);
      try {
        const res = await fetch(`${WORKER_URL}/api/onboarding/qr?slug=${encodeURIComponent(slug)}`, {
          headers: { 'Authorization': 'Bearer ' + PANEL_KEY }
        });
        const data = await res.json();
        if (res.ok && data.qr_base64) {
          lastQr = data.qr_base64;
          lastQrAt = Date.now();
          show(lastQr);
        } else {
          const f = document.getElementById('qrFallback');
          if (f) f.innerHTML = `<span class="icon">⚠️</span><strong>${escapeHtml(data.error || 'QR no disponible')}</strong>`;
        }
      } catch (_) { /* se reintenta en el próximo refresco */ }
    }

    async function sendLink(btn) {
      btn.disabled = true;
      try {
        await fetch(`${WORKER_URL}/api/tenant/send-link`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ t: slug })
        });
        showToast('Si tu solicitud fue aprobada, te enviamos el enlace por WhatsApp');
      } catch (_) {
        showToast('No se pudo enviar. Intenta nuevamente.');
      }
    }

    function showToast(msg) {
      const t = document.createElement('div');
      t.className = 'toast';
      t.textContent = msg;
      document.body.appendChild(t);
      setTimeout(() => {
        t.style.transition = 'opacity 0.3s';
        t.style.opacity = '0';
        setTimeout(() => t.remove(), 300);
      }, 2500);
